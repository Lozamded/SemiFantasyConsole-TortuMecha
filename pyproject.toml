[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "semi-fantasy-console"
version = "0.1.0"
description = "Semi-Fantasy Console — TortoiseEngine, TortoisePlayer, TortoiseStudio"
readme = "readme.md"
requires-python = ">=3.11"
dependencies = [
    "pygame>=2.6.0",
    "numpy>=1.24.0",
    "PyQt6>=6.6.0",
    "watchdog>=4.0.0",
    "pyinstaller>=6.0.0",
]

[project.scripts]
tortoiseplayer = "tortoiseplayer.__main__:main"
tortoisestudio = "tortoisestudio.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tortoisengine*", "tortoiseplayer*", "tortoisestudio*"]
